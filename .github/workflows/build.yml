name: Build  
  
on:  
  push:  
    branches: [ "1.20.1-3.0.0" ]  
  pull_request:  
    branches: [ "1.20.1-3.0.0" ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Setup Java 17  
        uses: actions/setup-java@v4  
        with:  
          distribution: temurin  
          java-version: 17  
  
      - name: Setup Gradle  
        uses: gradle/actions/setup-gradle@v4  
  
      - name: Make gradlew executable  
        run: chmod +x ./gradlew  
  
      - name: Build  
        run: ./gradlew build --no-daemon  
        env:  
          GRADLE_OPTS: -Xmx3G  
  
      - name: Upload JarJar artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: srelic-forge  
          path: build/libs/*-forge.jar  
  
      - name: Upload regular jar  
        uses: actions/upload-artifact@v4  
        with:  
          name: srelic-jar  
          path: build/libs/*-UnReg.jar